# nginx site — /etc/nginx/sites-available/salesforce-crm
# Replace crm.example.com; enable with:
#   sudo ln -s /etc/nginx/sites-available/salesforce-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d crm.example.com   (rewrites this file for 443)

server {
    listen 80;
    server_name crm.example.com;

    # App already sends security headers; nginx only proxies.
    client_max_body_size 12m;   # attachment JSON payloads (8MB file cap + base64)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE stream must not buffer.
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
